name: Release package

on:
    push:
        tags: ['v*.*.*']

permissions:
    attestations: write
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 11.19.0
            - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: '24'
                  cache: pnpm
            - name: Установить зависимости
              run: pnpm install --frozen-lockfile
            - name: Проверить тег и пакет
              shell: bash
              run: |
                  package_version="$(node -p "require('./package.json').version")"
                  test "${GITHUB_REF_NAME}" = "v${package_version}"
                  pnpm lint
                  pnpm test
                  pnpm typecheck
            - name: Собрать package
              run: pnpm pack --pack-destination package-output
            - name: Создать checksum
              shell: bash
              run: cd package-output && sha256sum *.tgz > SHA256SUMS
            - name: Подписать происхождение package
              uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
              with:
                  subject-path: package-output/*.tgz
            - name: Создать GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF_NAME}" package-output/* --verify-tag --generate-notes
